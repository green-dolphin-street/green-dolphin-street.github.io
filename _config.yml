# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.

# Site settings
title: Latrell Cartel
description: >- # this means to ignore newlines until "baseurl:"
  Things I learned five minutes ago
search: true
search_full_content: true
include: ["_pages"]
excerpt_separator: "<!--more-->"

# Add a theme
remote_theme: mmistakes/minimal-mistakes@4.27.3
minimal_mistakes_skin: sunrise

# Enable the remote theme plugin
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
kramdown:
  math_engine: nil


# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be ignored by Jekyll.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# --- Minimal Mistakes Theme Settings ---
# Site Author
author:
  # name             : "Latrell"
  avatar           : # "/assets/images/bio-photo.jpg" # Optional: path to your photo
  bio              : "Random things I learned five minutes ago" # A short bio
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github" # Font Awesome icon
      url: "https://github.com/green-dolphin-street"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/hkk534/"
    # Add more links as you like

# Site Footer
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/green-dolphin-street"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/hkk534/"
