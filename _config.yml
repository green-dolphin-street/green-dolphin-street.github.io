# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.

# Site settings
title: Latrell Cartel
description: >- # this means to ignore newlines until "baseurl:"
  # put description here

# Add a theme
theme: minimal-mistakes-jekyll

# This is for your social media links (optional)
github_username:  green-dolphin-street

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be ignored by Jekyll.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
